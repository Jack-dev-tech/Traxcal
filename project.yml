name: Traxcal
options:
  bundleIdPrefix: com.traxcal
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.32.3"
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  Traxcal:
    type: application
    platform: iOS
    sources:
      - path: Traxcal
      - path: Shared
    dependencies:
      - target: TraxcalWidgets
        embed: true
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - sdk: HealthKit.framework
      - sdk: WidgetKit.framework
    entitlements:
      path: Traxcal/Supporting/Traxcal.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.traxcal.shared
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Traxcal/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Traxcal
        CFBundleURLTypes:
          - CFBundleURLName: com.traxcal.app
            CFBundleURLSchemes: [traxcal]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Traxcal uses the camera to scan meals with AI and read barcodes.
        NSPhotoLibraryUsageDescription: Choose a meal photo for Traxcal to analyze.
        NSHealthShareUsageDescription: Traxcal reads your active energy and weight to personalize goals.
        NSHealthUpdateUsageDescription: Traxcal saves the food and water you log to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traxcal.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  TraxcalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TraxcalWidgets
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: TraxcalWidgets/TraxcalWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.traxcal.shared
    info:
      path: TraxcalWidgets/Info.plist
      properties:
        CFBundleDisplayName: Traxcal
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traxcal.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

  TraxcalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TraxcalTests
    dependencies:
      - target: Traxcal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traxcal.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Traxcal.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Traxcal

schemes:
  Traxcal:
    build:
      targets:
        Traxcal: all
        TraxcalTests: [test]
    test:
      targets:
        - TraxcalTests
    run:
      config: Debug
